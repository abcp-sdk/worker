# AgentWorker: expose the guest-only enrollment/token endpoint on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    location = /token {
        alias /run/shm/token;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the guest launcher downloads the current agent-worker binary
    # here on every boot, so a worker upgrade is an image change, not a golden
    # disk change. The guest disk still carries a fallback copy.
    location = /worker {
        alias /opt/agent-worker/agent-worker;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the xa11y computer-use CLI (Windows build). The guest launcher
    # installs it on PATH so a job can read/drive native apps via UI Automation.
    location = /xa11y.exe {
        alias /opt/agent-worker/xa11y.exe;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # The guest-side worker launcher. `install-worker.cmd` (run inside the guest)
    # refreshes worker-launch.cmd from here, so a launcher change is an image
    # change, not a golden-disk rebake.
    location = /worker-launch.cmd {
        alias /opt/agent-worker/worker-launch.cmd;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # The guest-side SYSTEM-elevation helper (refreshed alongside the launcher).
    location = /ewelevate.cmd {
        alias /opt/agent-worker/ewelevate.cmd;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
