# agent-worker: expose the guest-only enrollment/token endpoint on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    location = /token {
        alias /run/shm/token;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the guest launcher downloads the current agent-worker binary
    # here on every boot, so a worker upgrade is an image change, not a golden
    # disk change. The guest disk still carries a fallback copy.
    location = /worker {
        alias /opt/agent-worker/agent-worker;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the xa11y computer-use CLI (self-contained Mach-O binary).
    # The guest launcher installs it into /usr/local/bin and grants it the
    # Accessibility (TCC) permission.
    location = /xa11y {
        alias /opt/agent-worker/xa11y;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # Toolchain bridge: the guest reaches the in-cluster artifact registry ONLY
    # through this container (its sole reachable host is host.lan:8090), so the
    # worker's on-demand installer fetches toolchains THROUGH here. Big
    # toolchains (rust ~1.5G, julia ~800M) are slow over this hop but work.
    location /artifacts/ {
        proxy_pass http://artifact.worker.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host artifact.worker.svc.cluster.local;
        proxy_set_header Connection "";
    }
    location = /healthz {
        proxy_pass http://artifact.worker.svc.cluster.local/healthz;
    }

    location / {
        return 404;
    }
}
